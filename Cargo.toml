[package]
name = "vmrust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
hex = "0.4.3"
ruint = { version = "1.20.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
criterion = "0.8.2"
